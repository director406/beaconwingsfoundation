<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BWF - Empowering Lives.</title>
    <!-- Pre-paint theme: only apply dark if the visitor explicitly chose it
         (stored in localStorage). Deliberately ignores OS/browser dark-mode
         preference — there's no dark-mode toggle in the UI, so the site
         should default to light for everyone rather than silently going
         dark for visitors whose system prefers it. -->
    <script>
      (function () {
        if (localStorage.getItem('iiwc_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
